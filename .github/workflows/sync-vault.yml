name: sync-vault
on:
  workflow_dispatch:
    inputs:
      url:
        description: tarball of changed vault files
        required: true
      remove:
        description: space separated paths to remove
        required: false
        default: ""
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: unpack
        run: |
          curl -sSL -o d.tgz "${{ inputs.url }}"
          tar -xzf d.tgz=
          rm -f d.tgz
          for f in ${{ inputs.remove }}; do git rm -q --ignore-unmatch "$f"; done
          git status --short | head -20
          git status --short | wc -l
      - name: commit
        run: |
          git config user.name Semtexhigh
          git config user.email 67ace67a@gmail.com
          git add -A
          git commit -m "Build history up to v5.28"
          git push
