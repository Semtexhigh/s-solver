name: patch-site
on: workflow_dispatch
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: |
          python3 - <<'PY'
          p = 'index.html'
          s = open(p, encoding='utf-8').read()
          s = s.replace('<span class="badge">v5.27</span>', '<span class="badge">v5.28</span>')
          s = s.replace('href="vault.html" title="Build history (password)"', 'href="history.html" title="Build history (password)"')
          a = '<span>History</span></a>'
          assert s.count(a) == 1, s.count(a)
          s = s.replace(a, a + '\n    <a class="tablink" href="admin.html" title="Admin control panel (password)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span>Admin</span></a>')
          open(p, 'w', encoding='utf-8').write(s)
          print('v5.28:', s.count('v5.28'), 'history:', s.count('history.html'), 'admin:', s.count('admin.html'))
          PY
      - name: commit
        run: |
          git config user.name Semtexhigh
          git config user.email 67ace67a@gmail.com
          git add index.html
          git commit -m "History points at the current page, admin link added, badge v5.28"
          git push
