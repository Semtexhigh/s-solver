name: add-admin-page
on:
  workflow_dispatch:
    inputs:
      url:
        description: gzipped page to fetch
        required: true
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and unpack
        run: |
          curl -sSL -o admin.html.gz "${{ inputs.url }}"
          gunzip -f admin.html.gz
          wc -c admin.html
          sha256sum admin.html
      - name: commit
        run: |
          git config user.name Semtexhigh
          git config user.email 67ace67a@gmail.com
          git add admin.html
          git commit -m "Add the S Solver admin control panel"
          git push
